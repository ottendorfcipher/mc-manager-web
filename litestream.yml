# Litestream configuration for redstoneCipher on Cloud Run.
#
# Litestream continuously replicates the SQLite database to a GCS bucket,
# giving near-zero RPO without requiring a persistent disk.
#
# Authentication uses Application Default Credentials (ADC); Cloud Run
# automatically provides the service account token via the metadata server.
#
# Required env var:
#   LITESTREAM_GCS_BUCKET  — the GCS bucket name (set by infra/setup.sh)

dbs:
  - path: /data/mc-manager.db
    replicas:
      - url: gcs://${LITESTREAM_GCS_BUCKET}/db
        # Sync every 1 second; WAL frames are flushed immediately
        sync-interval: 1s
        # Retain 24 h of snapshots; enough for accidental-deletion recovery
        retention: 24h
