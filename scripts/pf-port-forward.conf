#
# pf rule: redirect localhost:443 -> localhost:5173 so Vite (which binds
# the non-privileged 5173) can transparently serve traffic addressed to
# https://redstonecipher.com/... without running Node as root.
#
# Load with:  sudo pfctl -e -f scripts/pf-port-forward.conf
# Disable:    sudo pfctl -d
#
rdr pass on lo0 inet proto tcp from any to any port 443 -> 127.0.0.1 port 5173
