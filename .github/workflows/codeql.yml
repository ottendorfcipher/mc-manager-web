name: CodeQL

# Static analysis of our OWN (first-party) code — the class of bug no dependency
# scanner catches: injection, auth mistakes, unsafe deserialization, path
# traversal, etc.
#
# NOTE: this private repo has no GitHub Advanced Security, so the code-scanning
# API (the Security tab) is unavailable — uploading SARIF there fails with
# "Code scanning is not enabled for this repository". We therefore run the
# analysis and publish the SARIF as a build artifact for manual review instead
# of uploading it. (gitleaks remains the active committed-secret control.)
#
# Dependency CVEs/policy are handled separately by security-audit.yml; this is
# strictly about first-party source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'   # Monday 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
          # No GHAS on this repo → don't upload to the code-scanning API (that
          # step fails with "Code scanning is not enabled"). Write SARIF locally
          # and publish it as an artifact below.
          upload: false
          output: codeql-results

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30
