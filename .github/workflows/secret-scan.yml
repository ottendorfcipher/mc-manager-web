name: Secret Scan

# Detects committed secrets (API keys, tokens, private keys) with gitleaks.
# Runs on every push/PR (secrets can be added in any file, not just deps) and
# weekly over the FULL history so a secret added long ago is still caught.
#
# The gitleaks binary is installed from a pinned release and its tarball is
# verified against a hardcoded SHA-256 before execution — a tampered release
# cannot run here. Hard-fails on any finding.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'   # Monday 08:00 UTC — full-history sweep
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the release checksums.txt).
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0   # full history so `gitleaks git` can scan all commits

      - name: Install gitleaks (pinned + checksum-verified)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --verbose --exit-code 1
