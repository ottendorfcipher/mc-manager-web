[package]
name = "redstonecipher-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
# Proprietary, never published to a registry. Prevents accidental `cargo publish`
# and lets cargo-deny skip the license check for our own crate.
publish = false

[[bin]]
name = "redstonecipher-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["cookie", "cookie-signed"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-gzip"] }
tower_governor = { version = "0.4", features = ["axum"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "chrono", "uuid"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling — single AppError wraps all error variants
thiserror = "2"
anyhow = "1"

# Auth
jsonwebtoken = "10"
# NOTE: the `oauth2` crate was removed — it was unused (auth/google.rs builds the
# OAuth URLs manually and performs token exchange via our own reqwest client).
# Removing it drops the entire legacy reqwest-0.11 / rustls-0.21 / webpki-0.101
# chain, clearing RUSTSEC-2026-0098, RUSTSEC-2026-0099 and RUSTSEC-2025-0134.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

# Discord bridge
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"] }

# Secrets encryption (AES-256-GCM for at-rest settings storage)
aes-gcm = "0.10"
hex    = "0.4"

# Pattern matching
regex = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# TypeScript type generation (dev dependency semantics, but needed at build time)
ts-rs = { version = "10", features = ["serde-json-impl", "chrono-impl", "uuid-impl"] }
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
axum-test = "15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
