[package]
name = "redstonecipher-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "redstonecipher-server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["cookie", "cookie-signed"] }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "chrono", "uuid"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling — single AppError wraps all error variants
thiserror = "2"
anyhow = "1"

# Auth
jsonwebtoken = "9"
oauth2 = "4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# TypeScript type generation (dev dependency semantics, but needed at build time)
ts-rs = { version = "10", features = ["serde-json-impl", "chrono-impl", "uuid-impl"] }
urlencoding = "2"
time = { version = "0.3", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
axum-test = "15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
