# nginx for the redstoneCipher frontend.
# Serves the built SPA, proxies dynamic routes to the backend, and serves the
# BlueMap tiles that the backend writes to a shared volume.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resource-pack and music uploads can be large.
    client_max_body_size 64m;

    # Security headers on every response, including the static SPA HTML/JS/CSS
    # that the backend never sees. The backend sets the same headers on the
    # responses it serves; the proxy location strips its copies so each header
    # appears exactly once.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.modrinth.com; img-src 'self' data: blob: https://mc-heads.net https://cdn.modrinth.com https://cdn.jsdelivr.net https://lh3.googleusercontent.com; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # BlueMap tiles (written by the backend, shared read-only here).
    location /map/ {
        alias /srv/map/;
        try_files $uri $uri/ =404;
    }

    # Everything the backend owns: API, auth, uploads, resource packs.
    location ~ ^/(api|auth|uploads|packs)(/|$) {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The backend emits its own copies of the headers set at server level;
        # hide them so the server-level versions are the single source of truth.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        # Server-sent events (chat, music) must stream unbuffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # SPA fallback: unknown paths return index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
