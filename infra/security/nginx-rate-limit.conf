# infra/security/nginx-rate-limit.conf
#
# nginx rate limiting for redstoneCipher.
#
# HOW TO APPLY:
#   1. Copy the limit_req_zone lines into the http {} block in /etc/nginx/nginx.conf
#      (or into the top of /etc/nginx/sites-available/redstonecipher.conf)
#   2. Copy the limit_req lines into the appropriate location {} blocks in your
#      site config (see placement notes below).
#   3. Test: nginx -t
#   4. Reload: nginx -s reload
#
# IDEMPOTENT deployment script on the server:
#   scp infra/security/nginx-rate-limit.conf root@203.0.113.10:/tmp/
#   ssh root@203.0.113.10 'bash /opt/redstonecipher/scripts/apply-nginx-rate-limit.sh'
#   (see scripts/apply-nginx-rate-limit.sh)

# ── Zones — add to the http { } block ────────────────────────────────────────
#
# Each zone is keyed by the client's binary IP address.
# Memory: "10m" holds ~160,000 unique IPs.

# Auth endpoints: allow 5 requests per minute per IP.
# Prevents OAuth callback flooding and brute-forcing the auth flow.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Chat send: allow 20 requests per minute per IP.
# Prevents chat spam from a single source.
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=20r/m;

# General API backstop: allow 120 requests per minute per IP (2 r/s).
# A reasonable ceiling for interactive use; will not affect normal navigation.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# Return HTTP 429 Too Many Requests (not the default 503).
limit_req_status 429;


# ── Location blocks — add inside server { } ───────────────────────────────────

# /auth/ block — 5/min, burst of 5 (allows short bursts without error).
# Placement: replace or augment the existing /auth/ location.
#
#   location ~ ^/auth/ {
#       limit_req zone=auth_limit burst=5 nodelay;
#       proxy_pass         http://127.0.0.1:8080;
#       proxy_set_header   Host $host;
#       proxy_set_header   X-Real-IP $remote_addr;
#       proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#       proxy_read_timeout 60s;
#   }

# /api/chat/send — 20/min, burst of 5.
# Must appear BEFORE the general /api/ location.
#
#   location = /api/chat/send {
#       limit_req zone=chat_limit burst=5 nodelay;
#       proxy_pass         http://127.0.0.1:8080;
#       proxy_set_header   Host $host;
#       proxy_set_header   X-Real-IP $remote_addr;
#       proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#   }

# /api/ general backstop — 120/min, burst of 30.
# Placement: the existing /api/ proxy_pass location.
#
#   location ~ ^/(api|internal)/ {
#       limit_req zone=api_limit burst=30 nodelay;
#       proxy_pass         http://127.0.0.1:8080;
#       ...
#   }
