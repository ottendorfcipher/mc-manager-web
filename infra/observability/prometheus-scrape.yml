# Prometheus scrape config for the redstoneCipher backend.
#
# The backend exposes Prometheus metrics at /metrics on its local port (8080),
# reachable only over localhost/Tailscale (not proxied by nginx). Drop this into
# your Prometheus `scrape_configs:` (or run a Prometheus that includes it) and
# point Alertmanager at infra/observability/alert-rules.yml.
#
# See docs/MONITORING.md for the full stack.

scrape_configs:
  - job_name: redstonecipher-backend
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          service: redstonecipher
          host: web

  # Optional: node_exporter for host CPU/RAM/disk (install separately).
  # - job_name: node
  #   static_configs:
  #     - targets: ["127.0.0.1:9100"]
